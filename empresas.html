<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - AmiConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-indigo-600"><div style="display:flex;align-items:center;gap:8px;"><img src="img/icon.png" alt="AmiConnect" style="height:40px;"><span style="font-size:1.3rem;font-weight:700;"><span style="color:#1e3a5f;">Ami</span><span style="color:#5cb85c;">Connect</span></span></div></h1>
                    <span class="text-gray-400">|</span>
                    <span class="text-gray-600" id="userName">Carregando...</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" class="text-gray-600 hover:text-indigo-600 transition">Início</a>
                    <a href="cardapio.html" class="text-gray-600 hover:text-indigo-600 transition">Cardápio</a>
                    <a id="navCategorias" href="categorias.html" class="text-gray-600 hover:text-indigo-600 transition">Categorias</a>
                    <a href="conversas.html" class="text-gray-600 hover:text-indigo-600 transition">Conversas</a>
                    <a href="pedidos.html" class="text-gray-600 hover:text-indigo-600 transition">Pedidos</a>
                    <a href="relatorios.html" class="text-gray-600 hover:text-indigo-600 transition">Relatórios</a>
                    <a href="configuracoes.html" class="text-gray-600 hover:text-indigo-600 transition">Minha Loja</a>
                    <a href="empresas.html" class="text-indigo-600 font-medium">Empresas</a>
                    <button onclick="toggleBotPausa()" id="btnPausa" title="Pausar/Reativar bot" class="relative flex items-center gap-1 px-3 py-1 rounded-full text-sm font-semibold transition-all bg-green-100 text-green-700 hover:bg-green-200">
                        <span id="btnPausaIcon" class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>
                        <span id="btnPausaTexto">Bot ativo</span>
                    </button>
                    <button onclick="window.location.href='pedidos.html'" class="relative text-gray-600 hover:text-indigo-600 transition" title="Pedidos pendentes">
                        <span class="text-2xl">🧾</span>
                        <span id="pedidosBadge" class="hidden absolute -top-1 -right-1 bg-orange-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                    </button>
                    <button onclick="mostrarAlertas()" class="relative text-gray-600 hover:text-indigo-600 transition">
                        <span class="text-2xl">🔔</span>
                        <span id="alertasBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                    </button>
                    <button onclick="logout()" class="text-red-600 hover:text-red-700 font-medium transition">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="mb-8 flex justify-between items-center">
            <div>
                <h2 class="text-3xl font-bold text-gray-900">Empresas</h2>
                <p class="text-gray-600 mt-1">Gerencie os restaurantes cadastrados na plataforma</p>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2 transition shadow-sm">
                <span class="text-xl">+</span> Nova Empresa
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 border-b border-gray-200">
                    <tr>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700">Nome</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700">Plano</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700">WhatsApp</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700">Ativo</th>
                        <th class="px-4 py-3 text-left font-semibold text-gray-700">Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyEmpresas">
                    <tr><td colspan="5" class="text-center py-8 text-gray-400">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Modal criar/editar empresa -->
    <div id="modalEmpresa" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold text-gray-900 mb-5" id="modalTitulo">Nova Empresa</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome do restaurante</label>
                    <input type="text" id="inputNome" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ex: Pizzaria do João">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp</label>
                    <input type="text" id="inputWhatsapp" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="+5511999999999">
                </div>
                <div id="senhaRow">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email de acesso</label>
                        <input type="email" id="inputEmail" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="gerente@restaurante.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Senha de acesso</label>
                        <input type="password" id="inputSenha" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Plano</label>
                    <select id="inputPlano" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="basico">Básico</option>
                        <option value="profissional">Profissional</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha do gerente</label>
                    <input type="password" id="inputSenhaGerente" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Senha para acesso aos relatórios">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeModal()" class="flex-1 border border-gray-300 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-50 transition">Cancelar</button>
                <button onclick="saveEmpresa()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal alertas -->
    <div id="alertasModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-2xl font-bold text-gray-900">🔔 Notificações</h3>
                <button onclick="fecharAlertas()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div id="alertasLista" class="flex-1 overflow-y-auto"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/pausa.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/alertas.js?v=18"></script>
    <script src="js/empresas.js"></script>
    <script>
        iniciarAlertas();
    </script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/socket.js"></script>
</body>
</html>
