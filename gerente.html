<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiConnect - Acesso Gerente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div style="text-align:center;margin-bottom:16px;">
                <img src="img/icon.png" alt="AmiConnect" style="height:70px;margin:0 auto 8px;display:block;">
                <div style="font-size:1.8rem;font-weight:700;">
                    <span style="color:#1e3a5f;">Ami</span><span style="color:#5cb85c;">Connect</span>
                </div>
            </div>
            <p class="text-gray-600">Acesso do Gerente</p>
        </div>

        <!-- Form -->
        <form id="gerenteLoginForm" class="space-y-6" onsubmit="handleGerenteLogin(event)">
            <div>
                <label for="empresa_slug" class="block text-sm font-medium text-gray-700 mb-2">
                    Identificador do Restaurante
                </label>
                <input
                    type="text"
                    id="empresa_slug"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                    placeholder="ex: restaurante-teste"
                >
            </div>

            <div>
                <label for="senha_gerente" class="block text-sm font-medium text-gray-700 mb-2">
                    Senha do Gerente
                </label>
                <input
                    type="password"
                    id="senha_gerente"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                    placeholder="••••••••"
                >
            </div>

            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm"></div>

            <button
                type="submit"
                id="btnEntrar"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200"
            >
                Entrar
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            <p>AmiConnect © 2026</p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/gerente.js"></script>
    <script>
        // Redireciona se já estiver logado
        if (sessionStorage.getItem('gerente_token')) {
            window.location.href = 'gerente-relatorios.html';
        }
    </script>
</body>
</html>
